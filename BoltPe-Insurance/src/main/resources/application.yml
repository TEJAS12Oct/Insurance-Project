server:
  port: ${SERVER_PORT}

spring:
  application:
    name: boltpe-insurance-project
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO}
    show-sql: ${JPA_SHOW_SQL}
    open-in-view: false
    properties:
      hibernate:
        format_sql: ${HIBERNATE_FORMAT_SQL}
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}

policy-planner:
  base-url: ${POLICY_PLANNER_BASE_URL}
  health:
    discovery-path: ${POLICY_PLANNER_HEALTH_DISCOVERY_PATH}
  super-top-up:
    discovery-path: ${POLICY_PLANNER_SUPER_TOP_UP_DISCOVERY_PATH}
  personal-accident:
    discovery-path: ${POLICY_PLANNER_PERSONAL_ACCIDENT_DISCOVERY_PATH}
  hospital-cash:
    discovery-path: ${POLICY_PLANNER_HOSPITAL_CASH_DISCOVERY_PATH:}
  connect-timeout-ms: ${POLICY_PLANNER_CONNECT_TIMEOUT_MS}
  read-timeout-ms: ${POLICY_PLANNER_READ_TIMEOUT_MS}

insurance:
  refresh:
    cron: ${INSURANCE_REFRESH_CRON}

management:
  endpoints:
    web:
      exposure:
        include: ${MANAGEMENT_ENDPOINTS}

logging:
  level:
    com.boltpe.insurance: ${INSURANCE_LOG_LEVEL}
